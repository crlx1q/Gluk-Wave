name: gluk_wave
version: 0.3.0+3
publish_to: none
description: Gluk Wave - adaptive Flutter music experience for mobile and desktop.

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_linux: ^1.2.1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  path: ^1.9.1
  file_selector: ^1.1.0
  discord_rich_presence: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo_reference.png
    - assets/audio/
